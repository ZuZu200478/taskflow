</style></head><body><div class="shell"><aside><div><div class="brand">Task<span>Flow</span></div><small>讓每件事，都有清楚的下一步。</small></div><nav aria-label="主要檢視"><button class="active" data-view="list">▦ 任務列表</button><button data-view="calendar">▤ 日曆</button><button data-view="timeline">◷ 時間軸</button><button data-view="matrix">⊞ 優先矩陣</button><button data-view="archive">✓ 已結案</button></nav><footer>個人的課業與生活工作台<br>資料儲存在此瀏覽器</footer></aside><main><section class="tools" aria-label="搜尋與篩選"><input id="search" type="search" aria-label="搜尋任務" placeholder="搜尋任務名稱或描述…"><div class="filters"><select id="status" aria-label="狀態"><option value="">所有狀態</option><option value="todo">待辦</option><option value="doing">進行中</option><option value="done">已完成</option><option value="closed">已結案</option></select><select id="group" aria-label="群組"></select><select id="importance" aria-label="重要性"><option value="">所有重要性</option></select><select id="urgency" aria-label="緊急度"><option value="">所有緊急度</option></select><select id="difficulty" aria-label="難度"><option value="">所有難度</option></select><select id="sort" aria-label="排序"><option value="due">截止時間：近到遠</option><option value="importance">重要性：高到低</option><option value="urgency">緊急度：高到低</option><option value="difficulty">難度：高到低</option></select><button id="reset">重設</button></div></section><div class="workspace"><section class="summary" aria-label="任務總覽"><h2>任務總覽</h2><section class="stats" aria-label="任務統計" id="stats"></section></section><div class="task-area"><header><div><h1>我的任務工作台</h1><p id="today"></p></div><button class="primary" id="add">＋ 新增任務</button></header><div class="section-head"><h2 id="view-title">任務列表</h2><span id="count" class="muted"></span></div><section id="content" aria-label="任務檢視"></section><p class="help">已結案任務保留於歷史紀錄。今日完成率＝今日到期或今日完成的任務中，已完成／已結案的比例。<br>資料只保留在目前的瀏覽器，清除瀏覽器資料後將無法復原。</p></div></div></main></div>
<dialog id="editor"><form id="task-form"><h2 id="form-title">新增任務</h2><input type="hidden" name="id"><label>任務名稱<input name="title" required maxlength="100" placeholder="例如：完成期中報告"></label><label>任務描述<textarea name="description" maxlength="2000" placeholder="記下需要完成的細節"></textarea></label><div class="form-row"><label>所屬群組<select name="group"></select></label><label>截止日期與時間<input name="due" type="datetime-local" required></label></div><div class="form-row"><label>重要性<select name="importance"></select></label><label>緊急度<select name="urgency"></select></label></div><div class="form-row"><label>難度<select name="difficulty"><option value="1">★ 簡單</option><option value="2">★★ 普通</option><option value="3">★★★ 困難</option></select></label><label>任務狀態<select name="status"><option value="todo">待辦</option><option value="doing">進行中</option><option value="done">已完成</option><option value="closed">已結案</option></select></label></div><div class="dialog-actions"><button type="button" data-close="editor">取消</button><button class="primary" type="submit">儲存任務</button></div></form></dialog>
<dialog id="detail"><h2 id="detail-title"></h2><dl id="detail-body"></dl><div class="dialog-actions"><button data-close="detail">關閉</button><button id="detail-edit" class="primary">編輯任務</button></div></dialog>
<dialog id="delete-dialog"><h2>刪除任務？</h2><p id="delete-message"></p><p class="muted">刪除後無法復原。</p><div class="dialog-actions"><button data-close="delete-dialog">取消</button><button class="primary" id="confirm-delete">確認刪除</button></div></dialog><div id="toast" role="status"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), KEY='taskflow-v1',groups={'study':['📚 課業','#b9673c'],'research':['🔬 研究','#8e7393'],'work':['💼 工作','#4b7c86'],'club':['🎹 社團','#b18938'],'life':['🏠 生活','#648563']},states={todo:'待辦',doing:'進行中',done:'已完成',closed:'已結案'};
let tasks=[],view='list',selected=null,pendingDelete=null,timer;
let calendarMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1),calendarSelected=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=d=>{const a=new Date(d);return `${a.getFullYear()}-${String(a.getMonth()+1).padStart(2,'0')}-${String(a.getDate()).padStart(2,'0')}`};
const local=d=>{const a=new Date(d);return day(a)+'T'+String(a.getHours()).padStart(2,'0')+':'+String(a.getMinutes()).padStart(2,'0')};
const fmt=d=>new Date(d).toLocaleString('zh-TW',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
function notify(message){$('#toast').textContent=message;$('#toast').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('#toast').style.display='none',3500)}
function valid(t){return t&&typeof t.id==='string'&&typeof t.title==='string'&&typeof t.description==='string'&&groups[t.group]&&states[t.status]&&Number.isFinite(new Date(t.due).getTime())&&[1,2,3,4,5].includes(t.importance)&&[1,2,3,4,5].includes(t.urgency)&&[1,2,3].includes(t.difficulty)}
try{const raw=localStorage.getItem(KEY);if(raw){const data=JSON.parse(raw);if(!Array.isArray(data)||!data.every(valid))throw Error();tasks=data}}catch(e){notify('儲存資料無法讀取。請勿清除瀏覽器資料；新任務將在成功儲存後取代原紀錄。')}
function commit(next){try{localStorage.setItem(KEY,JSON.stringify(next));tasks=next;render();return true}catch(e){notify('無法儲存：請確認瀏覽器允許本機儲存或尚有可用空間。');return false}}
function options(node,max){for(let i=1;i<=max;i++)node.add(new Option(i+' 級',i))}
$('#group').add(new Option('所有群組',''));for(const [k,g] of Object.entries(groups)){$('#group').add(new Option(g[0],k));$('#task-form [name=group]').add(new Option(g[0],k))}
for(const name of ['importance','urgency']){options($('#'+name),5);options($('#task-form [name='+name+']'),5)}options($('#difficulty'),3);
function filtered(){const q=$('#search').value.trim().toLocaleLowerCase();return tasks.filter(t=>(view==='archive'?t.status==='closed':t.status!=='closed')&&(!q||(t.title+' '+t.description).toLocaleLowerCase().includes(q))&&['status','group','importance','urgency','difficulty'].every(k=>!$('#'+k).value||String(t[k])===$('#'+k).value)).sort((a,b)=>$('#sort').value==='due'?new Date(a.due)-new Date(b.due):b[$('#sort').value]-a[$('#sort').value]||new Date(a.due)-new Date(b.due))}
function card(t){const overdue=new Date(t.due)<new Date()&&!['done','closed'].includes(t.status),next={todo:['doing','開始任務'],doing:['done','完成任務'],done:['closed','結案']};return `<article class="card" style="--group:${groups[t.group][1]}"><div class="topline"><span>${groups[t.group][0]}</span><span class="badge">${states[t.status]}</span></div><h3>${esc(t.title)}</h3>${t.description?'<p>'+esc(t.description)+'</p>':''}<div class="attrs"><span>重要 ${t.importance}/5</span><span>緊急 ${t.urgency}/5</span><span aria-label="難度 ${t.difficulty} 級">${'★'.repeat(t.difficulty)}</span></div><div class="due ${overdue?'overdue':''}">${overdue?'已逾期 · ': '截止 · '}${fmt(t.due)}</div><div class="actions">${next[t.status]?`<button class="primary" data-action="advance" data-id="${esc(t.id)}">${next[t.status][1]}</button>`:''}<button data-action="edit" data-id="${esc(t.id)}">編輯</button><button class="danger" data-action="delete" data-id="${esc(t.id)}">刪除</button></div></article>`}
function render(){const today=day(new Date());$('#today').textContent=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'});const counts=Object.keys(states).map(s=>tasks.filter(t=>t.status===s).length);const pool=tasks.filter(t=>day(t.due)===today||(t.completedAt&&day(t.completedAt)===today));const completed=pool.filter(t=>['done','closed'].includes(t.status)).length,rate=pool.length?Math.round(completed/pool.length*100):0;$('#stats').innerHTML=Object.keys(states).map((s,i)=>`<div class="stat"><span>${states[s]}</span><strong>${counts[i]}</strong></div>`).join('')+`<div class="stat"><span>今日完成率</span><strong>${rate}%</strong><div class="bar"><i style="width:${rate}%"></i></div></div>`;const rows=filtered();$('#count').textContent=rows.length+' 項任務';$('#view-title').textContent={list:'任務列表',timeline:'截止時間軸',matrix:'任務優先矩陣',calendar:'任務日曆',archive:'已結案紀錄'}[view];document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-current',b.dataset.view===view?'page':'false')});
if(view==='calendar'){renderCalendar(rows);return}
if(!rows.length){$('#content').innerHTML=`<div class="empty"><h3>${tasks.length?'目前沒有符合條件的任務':'從第一個任務開始'}</h3><p>${tasks.length?'調整搜尋或篩選條件，查看其他任務。':'按下「＋ 新增任務」，安排你的下一步。'}</p></div>`;return}
if(view==='list'||view==='archive'){$('#content').innerHTML='<div class="cards">'+rows.map(card).join('')+'</div>';return}
if(view==='timeline'){const sorted=[...rows].sort((a,b)=>new Date(a.due)-new Date(b.due));let last='';$('#content').innerHTML=sorted.map(t=>{const d=day(t.due),tomorrow=new Date();tomorrow.setDate(tomorrow.getDate()+1);const title=d===today?'今天':d===day(tomorrow)?'明天':new Date(t.due).toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric'});let heading=d!==last?`<h3 class="timeline-day">${title}</h3>`:'';last=d;return heading+`<div class="timeline-row"><time>${new Date(t.due).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false})}</time>${card(t)}</div>`}).join('');return}
const buckets={};const points=rows.map((t,i)=>{const pressure=Math.max(0,Math.min(1,1-(new Date(t.due)-Date.now())/(7*86400000)));const key=t.importance+'-'+Math.round(pressure*10);const n=buckets[key]||0;buckets[key]=n+1;const x=Math.max(5,Math.min(95,6+(t.importance-1)*22+(n%3-1)*2)),y=Math.max(7,Math.min(93,8+pressure*84+Math.floor(n/3)*2));return `<button class="point" style="left:${x}%;top:${y}%;--group:${groups[t.group][1]}" data-action="detail" data-id="${esc(t.id)}" aria-label="${esc(t.title)}，重要性 ${t.importance}，${states[t.status]}" title="${esc(t.title)} · ${fmt(t.due)}">${i+1}</button>`}).join('');$('#content').innerHTML=`<div class="matrix-wrap"><div class="axis"><span>時間充裕</span><span>重要性 × 時間壓力</span></div><div class="matrix"><span class="quadrant">可規劃</span><span class="quadrant q2">重要但可安排</span><span class="quadrant q3">低優先／快速處理</span><span class="quadrant q4">優先處理</span>${points}</div><div class="axis"><span>低重要性 · 時間緊迫</span><span>高重要性</span></div><p class="matrix-note">點選圓點或下方任務名稱查看詳細資料。剩餘 7 天以上位於上方，越接近截止時間越往下；已逾期位於底部。重要性 3 級在中線，剩餘 3.5 天為時間分界。每分鐘自動更新；同區圓點略微錯開，位置以屬性數值為準。已完成任務也保留至結案。</p><div class="legend">${rows.map((t,i)=>`<button data-action="detail" data-id="${esc(t.id)}">${i+1}. ${esc(t.title)}</button>`).join('')}</div></div>`}

function renderCalendar(rows){
 const year=calendarMonth.getFullYear(),month=calendarMonth.getMonth(),first=new Date(year,month,1),start=new Date(year,month,1-first.getDay());const today=day(new Date());let cells='';
 for(let i=0;i<42;i++){const date=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),key=day(date),items=rows.filter(t=>day(t.due)===key).sort((a,b)=>new Date(a.due)-new Date(b.due));
 cells+=`<button class="calendar-day ${date.getMonth()!==month?'outside':''} ${key===today?'today':''} ${key===calendarSelected?'selected':''}" data-calendar-date="${key}" aria-pressed="${key===calendarSelected}" aria-label="${date.getFullYear()}年${date.getMonth()+1}月${date.getDate()}日，${items.length}項任務"><span class="date-number">${date.getDate()}</span>${items.slice(0,2).map(t=>`<span class="calendar-event" style="--group:${groups[t.group][1]}">${esc(t.title)}</span>`).join('')}${items.length>2?'<span class="calendar-more">另 '+(items.length-2)+' 項</span>':''}${items.length?'<span class="calendar-mobile-count">'+items.length+' 項</span>':''}</button>`;
 }
 const selectedRows=calendarSelected?rows.filter(t=>day(t.due)===calendarSelected).sort((a,b)=>new Date(a.due)-new Date(b.due)):[];
 $('#content').innerHTML=`<div class="calendar-panel"><div class="calendar-toolbar"><h3 aria-live="polite">${year} 年 ${month+1} 月</h3><div><button data-calendar-nav="prev" aria-label="上一個月">上個月</button><button data-calendar-nav="today">本月</button><button data-calendar-nav="next" aria-label="下一個月">下個月</button></div></div><div class="calendar-week">${['日','一','二','三','四','五','六'].map(d=>'<span>'+d+'</span>').join('')}</div><div class="calendar-grid">${cells}</div><p class="calendar-caption">以截止日期顯示任務，套用上方搜尋與篩選。點選日期查看任務；已結案任務請至結案紀錄查看。</p></div><section class="day-tasks"><h3>${calendarSelected?calendarSelected+' 的任務':'選擇日期查看任務'}</h3>${calendarSelected?(selectedRows.length?'<div class="cards">'+selectedRows.map(card).join('')+'</div>':'<div class="empty">這一天沒有符合條件的任務。</div>'):''}</section>`;
}
document.addEventListener('click',e=>{const dateButton=e.target.closest('[data-calendar-date]');if(dateButton){calendarSelected=dateButton.dataset.calendarDate;render();const current=document.querySelector('[data-calendar-date="'+calendarSelected+'"]');if(current)current.focus()}const monthButton=e.target.closest('[data-calendar-nav]');if(monthButton){const action=monthButton.dataset.calendarNav;calendarMonth=action==='today'?new Date(new Date().getFullYear(),new Date().getMonth(),1):new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+(action==='next'?1:-1),1);calendarSelected=null;render();document.querySelector('[data-calendar-nav="'+action+'"]').focus()}});

function edit(id){const t=tasks.find(t=>t.id===id),form=$('#task-form');form.reset();$('#form-title').textContent=t?'編輯任務':'新增任務';form.elements.id.value=t?t.id:'';if(t){for(const key of ['title','description','group','importance','urgency','difficulty','status'])form.elements[key].value=t[key];form.elements.due.value=local(t.due)}else{form.elements.due.value=local(Date.now()+86400000);form.elements.importance.value=3;form.elements.urgency.value=3}$('#editor').showModal()}
function detail(id){const t=tasks.find(t=>t.id===id);if(!t)return;selected=id;$('#detail-title').textContent=t.title;$('#detail-body').innerHTML=[['描述',t.description||'未填寫'],['群組',groups[t.group][0]],['截止時間',fmt(t.due)],['重要性',t.importance+' / 5'],['緊急度',t.urgency+' / 5'],['難度','★'.repeat(t.difficulty)],['狀態',states[t.status]]].map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('');$('#detail').showModal()}
$('#add').onclick=()=>edit();$('#detail-edit').onclick=()=>{$('#detail').close();edit(selected)};
document.addEventListener('click',e=>{const close=e.target.closest('[data-close]');if(close)$('#'+close.dataset.close).close();const nav=e.target.closest('[data-view]');if(nav){view=nav.dataset.view;$('#status').value='';render()}const b=e.target.closest('[data-action]');if(!b)return;const t=tasks.find(t=>t.id===b.dataset.id);if(!t)return;if(b.dataset.action==='edit')edit(t.id);if(b.dataset.action==='detail')detail(t.id);if(b.dataset.action==='delete'){pendingDelete=t.id;$('#delete-message').textContent='即將刪除「'+t.title+'」。';$('#delete-dialog').showModal()}if(b.dataset.action==='advance'){const status={todo:'doing',doing:'done',done:'closed'}[t.status];if(status&&commit(tasks.map(a=>a.id===t.id?{...a,status,completedAt:status==='done'?new Date().toISOString():a.completedAt}:a)))notify('已更新為'+states[status])}});
$('#confirm-delete').onclick=()=>{if(commit(tasks.filter(t=>t.id!==pendingDelete))){$('#delete-dialog').close();notify('任務已刪除')}};
$('#task-form').onsubmit=e=>{e.preventDefault();const f=e.target,previous=tasks.find(t=>t.id===f.elements.id.value),title=f.elements.title.value.trim();if(!title){f.elements.title.setCustomValidity('請輸入任務名稱');f.elements.title.reportValidity();return}const status=f.elements.status.value,finished=['done','closed'].includes(status);const t={id:previous?previous.id:crypto.randomUUID(),title,description:f.elements.description.value.trim(),group:f.elements.group.value,due:new Date(f.elements.due.value).toISOString(),importance:Number(f.elements.importance.value),urgency:Number(f.elements.urgency.value),difficulty:Number(f.elements.difficulty.value),status,createdAt:previous?previous.createdAt:new Date().toISOString(),completedAt:finished?(previous?.completedAt||new Date().toISOString()):null};if(commit(previous?tasks.map(a=>a.id===t.id?t:a):[...tasks,t])){$('#editor').close();notify(previous?'任務已更新':'任務已新增')}};
$('#task-form [name=title]').oninput=e=>e.target.setCustomValidity('');
for(const id of ['search','status','group','importance','urgency','difficulty','sort'])$('#'+id).addEventListener(id==='search'?'input':'change',render);
$('#reset').onclick=()=>{for(const id of ['search','status','group','importance','urgency','difficulty'])$('#'+id).value='';$('#sort').value='due';render()};setInterval(render,60000);window.addEventListener('storage',e=>{if(e.key!==KEY)return;try{const next=e.newValue?JSON.parse(e.newValue):[];if(Array.isArray(next)&&next.every(valid)){tasks=next;render()}}catch{notify('其他分頁的資料無法讀取')}});render();
</script></body></html>
